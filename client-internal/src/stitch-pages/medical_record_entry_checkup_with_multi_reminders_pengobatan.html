<!DOCTYPE html>

<style>
        /* Custom styles for floating labels and interactions */
        .input-group { position: relative; }
        .floating-input {
            border: 1px solid theme('colors.outline-variant');
            background-color: theme('colors.surface-container-lowest');
            padding: 24px 16px 8px 16px; /* Space for floating label */
            border-radius: theme('borderRadius.xl');
            width: 100%;
            transition: all 0.2s ease-in-out;
            outline: none;
        }
        .floating-input:focus {
            border-color: theme('colors.primary');
            box-shadow: 0 0 0 1px theme('colors.primary');
        }
        .floating-label {
            position: absolute;
            left: 16px;
            top: 16px;
            pointer-events: none;
            transition: all 0.2s ease-in-out;
            color: theme('colors.on-surface-variant');
            transform-origin: left top;
        }
        .floating-input:focus ~ .floating-label,
        .floating-input:not(:placeholder-shown) ~ .floating-label {
            top: 8px;
            transform: scale(0.75);
            color: theme('colors.primary');
        }
        
        /* Segmented control active state */
        .seg-btn[data-active="true"] {
            background-color: theme('colors.surface-container-lowest');
            color: theme('colors.on-surface');
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            font-weight: 600;
        }
        .seg-btn[data-active="false"] {
            color: theme('colors.on-surface-variant');
            background-color: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface antialiased pb-32"> <!-- pb-32 to account for sticky footer -->
<!-- Header (Transactional logic: Nav shell suppressed, Back action dominant) -->
<header class="w-full sticky top-0 z-50 bg-surface/90 backdrop-blur-md border-b border-outline-variant flex items-center justify-between px-container-margin h-16 shadow-sm">
<button class="p-2 -ml-2 rounded-full hover:bg-surface-container-low transition-colors text-on-surface flex items-center justify-center" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-on-surface flex-1 text-center">Isi Detail Medis</h1>
<button class="text-primary font-label-md text-label-md hover:text-primary-container transition-colors py-2 px-4 -mr-4" type="button">
            Save
        </button>
</header>
<!-- Main Content Canvas -->
<main class="max-w-4xl mx-auto px-container-margin mt-section-gap">
<form class="space-y-section-gap">
<!-- Section 1: Pemeriksaan Fisik -->
<section class="bg-surface-container-lowest rounded-xl border border-outline-variant shadow-sm overflow-hidden">
<div class="px-6 py-4 border-b border-outline-variant bg-surface/50">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Pemeriksaan Fisik</h2>
</div>
<div class="p-6 space-y-6">
<!-- Numeric Inputs Grid -->
<div class="grid grid-cols-2 gap-4">
<div class="input-group">
<input class="floating-input font-body-md text-body-md text-on-surface" id="weight" placeholder=" " type="number"/>
<label class="floating-label font-body-md text-body-md" for="weight">Weight (kg) <span class="text-primary">*</span></label>
</div>
<div class="input-group">
<input class="floating-input font-body-md text-body-md text-on-surface" id="temp" placeholder=" " type="number"/>
<label class="floating-label font-body-md text-body-md" for="temp">Temperature (°C)</label>
</div>
</div>
<!-- General Condition Dropdown -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="general_condition">General Physical Condition</label>
<div class="relative">
<select class="w-full appearance-none border border-outline-variant bg-surface-container-lowest rounded-xl py-3 px-4 pr-10 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="general_condition">
<option disabled="" selected="" value="">Select condition...</option>
<option value="healthy">Healthy / Active</option>
<option value="lethargic">Lethargic</option>
<option value="weak">Weak</option>
<option value="critical">Critical</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none">expand_more</span>
</div>
</div>
<!-- Heart Rate & Respiratory Rate Text Field -->
<div class="input-group">
<input class="floating-input font-body-md text-body-md text-on-surface" id="hr_rr" placeholder=" " type="text"/>
<label class="floating-label font-body-md text-body-md" for="hr_rr">Heart Rate &amp; Respiratory Rate</label>
</div>
</div>
</section>
<!-- Section 2: Routine Checkup Results -->
<section class="bg-surface-container-lowest rounded-xl border border-outline-variant shadow-sm overflow-hidden">
<div class="px-6 py-4 border-b border-outline-variant bg-surface/50">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Routine Checkup Results</h2>
</div>
<div class="p-6 space-y-8">
<!-- Palpation Results -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="palpation">Palpation Results</label>
<textarea class="w-full border border-outline-variant bg-surface-container-lowest rounded-xl p-4 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors resize-y" id="palpation" placeholder="Describe palpation findings..." rows="3"></textarea>
</div>
<!-- Hygiene Status (Segmented Controls) -->
<div class="space-y-4">
<h3 class="font-label-md text-label-md text-on-surface border-b border-outline-variant pb-2">Hygiene Status</h3>
<!-- Teeth -->
<div class="flex items-center justify-between py-2">
<span class="font-body-md text-body-md text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-outline" style="font-size: 20px;">dentistry</span>
                                Teeth
                            </span>
<div aria-label="Teeth hygiene status" class="flex bg-surface-container rounded-lg p-1 gap-1" role="group">
<button class="seg-btn px-4 py-1.5 rounded-md font-label-sm text-label-sm transition-all" data-active="true" onclick="toggleSegment(this)" type="button">Clean</button>
<button class="seg-btn px-4 py-1.5 rounded-md font-label-sm text-label-sm transition-all" data-active="false" onclick="toggleSegment(this)" type="button">Needs Cleaning</button>
</div>
</div>
<!-- Nails -->
<div class="flex items-center justify-between py-2 border-t border-surface-variant">
<span class="font-body-md text-body-md text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-outline" style="font-size: 20px;">front_hand</span>
                                Nails
                            </span>
<div aria-label="Nails hygiene status" class="flex bg-surface-container rounded-lg p-1 gap-1" role="group">
<button class="seg-btn px-4 py-1.5 rounded-md font-label-sm text-label-sm transition-all" data-active="true" onclick="toggleSegment(this)" type="button">Clean</button>
<button class="seg-btn px-4 py-1.5 rounded-md font-label-sm text-label-sm transition-all" data-active="false" onclick="toggleSegment(this)" type="button">Needs Cleaning</button>
</div>
</div>
<!-- Ears -->
<div class="flex items-center justify-between py-2 border-t border-surface-variant">
<span class="font-body-md text-body-md text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-outline" style="font-size: 20px;">hearing</span>
                                Ears
                            </span>
<div aria-label="Ears hygiene status" class="flex bg-surface-container rounded-lg p-1 gap-1" role="group">
<button class="seg-btn px-4 py-1.5 rounded-md font-label-sm text-label-sm transition-all" data-active="true" onclick="toggleSegment(this)" type="button">Clean</button>
<button class="seg-btn px-4 py-1.5 rounded-md font-label-sm text-label-sm transition-all" data-active="false" onclick="toggleSegment(this)" type="button">Needs Cleaning</button>
</div>
</div>
</div>
<!-- Nutrition Recommendations -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="nutrition">Nutrition &amp; Vitamin Recommendations</label>
<textarea class="w-full border border-outline-variant bg-surface-container-lowest rounded-xl p-4 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors resize-y" id="nutrition" placeholder="Dietary advice, supplements..." rows="3"></textarea>
</div>
<!-- Periodic Care Recommendations -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="periodic">Periodic Care Recommendations</label>
<textarea class="w-full border border-outline-variant bg-surface-container-lowest rounded-xl p-4 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors resize-y" id="periodic" placeholder="Next checkup date, grooming needs..." rows="2"></textarea>
</div>
</div>
</section>
<section class="bg-surface-container-lowest rounded-xl border border-outline-variant shadow-sm overflow-hidden">
<div class="px-6 py-4 border-b border-outline-variant bg-surface/50 flex items-center gap-2">
<span class="material-symbols-outlined text-primary">alarm</span>
<h2 class="font-headline-sm text-headline-sm text-on-surface">Atur Pengingat</h2>
</div>
<div class="p-6 space-y-6">
<div class="space-y-3" id="reminders-list">
<div class="bg-primary-fixed/30 border border-primary-fixed-dim rounded-xl p-4 relative">
<div class="flex justify-between items-start mb-2">
<span class="bg-primary-container text-on-primary text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">Vaksin</span>
<button class="text-error hover:bg-error-container/50 p-1 rounded-full transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">delete</span>
</button>
</div>
<p class="font-label-md text-on-surface mb-2">Booster F4 Tahunan</p>
<div class="flex items-center gap-1.5 text-on-surface-variant font-body-sm">
<span class="material-symbols-outlined text-[18px]">calendar_today</span>
<span>13 May 2027</span>
</div>
</div>
</div>
<hr class="border-outline-variant"/>
<div class="space-y-4">
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="reminder_service">Pilih Layanan Pengingat</label>
<div class="relative">
<select class="w-full appearance-none border border-outline-variant bg-surface-container-lowest rounded-xl py-3 px-4 pr-10 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="reminder_service">
<option selected="" value="pengobatan">Pengobatan</option>
<option value="vaksin">Vaksin</option>
<option value="kontrol">Kontrol</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none">expand_more</span>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="reminder_desc">Deskripsi Pengingat</label>
<textarea class="w-full border border-outline-variant bg-surface-container-lowest rounded-xl p-4 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors resize-y" id="reminder_desc" placeholder="e.g., Jadwal kontrol untuk evaluasi pasca-operasi atau cek darah lanjutan..." rows="3"></textarea>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="reminder_date">Tanggal Pengingat</label>
<input class="w-full border border-outline-variant bg-surface-container-lowest rounded-xl py-3 px-4 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="reminder_date" placeholder="mm/dd/yyyy" type="date"/>
</div>
<button class="w-full mt-2 border-2 border-primary text-primary font-label-md py-3 rounded-full flex items-center justify-center gap-2 hover:bg-primary/5 transition-all" type="button">
<span class="material-symbols-outlined text-[20px]">add</span>
                Tambah Pengingat
            </button>
</div>
</div>
</section></form>
</main>
<!-- Sticky Footer Action -->
<div class="fixed bottom-0 left-0 w-full bg-surface/95 backdrop-blur-sm border-t border-outline-variant px-container-margin py-4 pb-[max(1rem,env(safe-area-inset-bottom))] z-40 shadow-[0_-4px_20px_rgba(0,0,0,0.05)]">
<div class="max-w-4xl mx-auto">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 rounded-full flex items-center justify-center gap-2 hover:bg-on-primary-fixed-variant active:scale-[0.98] transition-all shadow-md" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1; font-size: 20px;">save</span>
                Simpan Rekam Medis
            </button>
</div>
</div>
<script>
        // Micro-interaction for segmented controls
        function toggleSegment(clickedBtn) {
            const container = clickedBtn.parentElement;
            const buttons = container.querySelectorAll('.seg-btn');
            
            // Turn off all in this group
            buttons.forEach(btn => btn.setAttribute('data-active', 'false'));
            
            // Turn on clicked
            clickedBtn.setAttribute('data-active', 'true');
        }
    </script>
</body></html>
