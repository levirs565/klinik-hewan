<!-- Note: TopAppBar, BottomNavBar, and NavigationDrawer are suppressed per Shared Components Logic (The "Semantic Shell" Mandate) for Linear/Transactional pages like Login. -->
<main class="flex-grow flex flex-col items-center justify-center p-container-margin w-full max-w-md mx-auto">
<!-- Top Section: Logo & Titles -->
<div class="flex flex-col items-center text-center mb-10 w-full">
<div class="w-24 h-24 mb-6 rounded-lg overflow-hidden border border-outline-variant/30 shadow-sm flex items-center justify-center bg-surface">
<img alt="VetConnect Clinic Logo" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/ADBb0uhoprPZCDw0Guxd6rOT9_xRPkuQGTkfjEZhTZZqntslEQ_b-kfQE-NsJQ7BMu-LzriS0O3WF0O254UU6ZlFn_BtgyXy5xZeZVukAS7cs2WAdHgge8YIqqyZ7yd0ieGGwwZxzyFTNYP0t1qqBfeqnnRLvd4BMmZgjUqzFssNJEjxKAWhZ8-Z6JN8m_D8V_-xq7MMLtKvt8IkezDCBWYiCv9trYUZYe2lLN-PQtzf68VfLo_PR5a6C3y9jFw">
</div>
<h1 class="font-headline-lg text-headline-lg text-primary mb-2">Staff Portal</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Manager, Receptionist, &amp; Doctor Access</p>
</div>
<!-- Middle Section: Login Form Container -->
<div class="w-full bg-surface rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.05)] border border-outline-variant p-6 md:p-8">
<form action="#" class="space-y-6" method="POST">
<!-- Username Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="username">Username</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">person</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:ring-2 focus:ring-primary focus:border-primary transition-colors placeholder:text-outline/70" id="username" name="username" placeholder="Enter username" required="" type="text">
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-3 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:ring-2 focus:ring-primary focus:border-primary transition-colors placeholder:text-outline/70" id="password" name="password" placeholder="Enter password" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Action Section -->
<div class="pt-2">
<button class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-on-primary bg-primary-container hover:bg-primary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors duration-200" type="submit">
                        Sign In
                    </button>
</div>
</form>
</div>
</main>
<!-- Footer Section -->
<footer class="mt-auto py-6 bg-surface-container-low border-t border-outline-variant w-full">
<div class="flex items-center justify-center space-x-2 text-on-surface-variant font-label-sm text-label-sm">
<span class="material-symbols-outlined" style="font-size: 16px;">gpp_good</span>

</div>
</footer>
