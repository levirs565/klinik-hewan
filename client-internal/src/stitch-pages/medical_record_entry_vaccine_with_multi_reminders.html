<!DOCTYPE html>

<html lang="en"><head>

<title>Isi Detail Medis - Vaccine</title>

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

      min-height: max(884px, 100dvh);
    }

<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-md antialiased">
<header class="sticky top-0 bg-surface z-50 flex items-center justify-between px-gutter h-16 w-full border-b border-outline-variant shadow-sm transition-colors duration-200">
<button aria-label="Go back" class="p-2 -ml-2 rounded-full hover:bg-surface-container-low transition-colors text-on-surface">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-on-surface truncate px-4">Isi Detail Medis</h1>
<button class="font-label-md text-label-md text-primary hover:text-on-primary-fixed-variant transition-colors p-2 -mr-2 uppercase tracking-wider">Save</button>
</header>
<main class="flex-grow px-gutter py-section-gap pb-32 md:px-container-margin md:max-w-3xl md:mx-auto w-full">
<section class="mb-section-gap">
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-6 border-b border-outline-variant pb-2">Pemeriksaan Fisik</h2>
<div class="grid grid-cols-2 gap-4 mb-6">
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1" for="weight">Weight (kg) <span class="text-primary">*</span></label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-3 py-3 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary transition-shadow" id="weight" placeholder="e.g. 5.2" step="0.1" type="number"/>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1" for="temperature">Temperature (°C) <span class="text-primary">*</span></label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-3 py-3 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary transition-shadow" id="temperature" placeholder="e.g. 38.5" step="0.1" type="number"/>
</div>
</div>
<div class="mb-6">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1" for="condition">General Physical Condition <span class="text-primary">*</span></label>
<div class="relative">
<select class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-3 py-3 font-body-md text-body-md text-on-surface appearance-none focus:border-primary focus:ring-1 focus:ring-primary transition-shadow" id="condition">
<option disabled="" selected="" value="">Select condition</option>
<option value="excellent">Excellent</option>
<option value="good">Good</option>
<option value="fair">Fair</option>
<option value="poor">Poor</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-on-surface-variant">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1" for="hr-rr">Heart Rate &amp; Respiratory Rate</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-3 py-3 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary transition-shadow" id="hr-rr" placeholder="e.g. HR: 120 bpm, RR: 24 bpm" type="text"/>
</div>
</section>
<section>
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-6 border-b border-outline-variant pb-2">Vaccination Details</h2>
<div class="mb-6">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1" for="vaccine-type">Vaccine Type <span class="text-primary">*</span></label>
<div class="relative">
<select class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-3 py-3 font-body-md text-body-md text-on-surface appearance-none focus:border-primary focus:ring-1 focus:ring-primary transition-shadow" id="vaccine-type">
<option disabled="" selected="" value="">Select vaccine</option>
<option value="f3">F3</option>
<option value="f4">F4</option>
<option value="rabies">Rabies</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-on-surface-variant">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<div class="mb-6">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1" for="brand-batch">Brand &amp; Batch Number</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-3 py-3 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary transition-shadow" id="brand-batch" placeholder="Enter brand and batch details" type="text"/>
</div>
<div class="mb-6">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1" for="date-administered">Date Administered <span class="text-primary">*</span></label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-3 py-3 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary transition-shadow" id="date-administered" type="date"/>
</div>
<div class="mb-6">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-3">Pre-Vaccine Condition <span class="text-primary">*</span></label>
<div class="flex gap-6">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="w-5 h-5 text-primary border-outline-variant focus:ring-primary bg-surface-container-lowest" name="pre-condition" type="radio" value="healthy"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary transition-colors">Healthy</span>
</label>
<label class="flex items-center gap-2 cursor-pointer group">
<input class="w-5 h-5 text-primary border-outline-variant focus:ring-primary bg-surface-container-lowest" name="pre-condition" type="radio" value="not-healthy"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary transition-colors">Not Healthy</span>
</label>
</div>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1" for="reaction-notes">Post-Vaccine Reaction Notes</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-3 py-3 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary transition-shadow resize-y" id="reaction-notes" placeholder="Note any immediate reactions or observations..." rows="4"></textarea>
</div>
</section><section class="mt-section-gap">
<div class="flex items-center gap-2 mb-6 border-b border-outline-variant pb-2">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">notifications</span>
<h2 class="font-headline-sm text-headline-sm text-on-surface">Atur Pengingat</h2>
</div>
<!-- Saved Reminder Card -->
<div class="bg-surface-container-low rounded-xl p-4 mb-4">
<div class="flex justify-between items-start mb-2">
<span class="bg-primary-container text-on-primary-container text-[10px] font-bold px-2 py-0.5 rounded-full uppercase">Vaksin</span>
<button class="text-error hover:bg-error/10 p-1 rounded-full transition-colors">
<span class="material-symbols-outlined text-[20px]">delete</span>
</button>
</div>
<p class="font-headline-sm text-headline-sm text-on-surface mb-2">Booster F4 Tahunan</p>
<div class="flex items-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">calendar_today</span>
<span class="text-body-sm font-medium">13 May 2027</span>
</div>
</div>
<!-- Subtle Divider -->
<div class="border-b border-outline-variant/30 mb-6"></div>
<!-- Input Area -->
<div class="space-y-6">
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1" for="reminder-service">Pilih Layanan Pengingat</label>
<div class="relative">
<select class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-3 py-3 font-body-md text-body-md text-on-surface appearance-none focus:border-primary focus:ring-1 focus:ring-primary" id="reminder-service">
<option selected="" value="vaksin">Vaksin</option>
<option value="pemeriksaan">Pemeriksaan Rutin</option>
<option value="obat">Obat</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-on-surface-variant">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1" for="reminder-desc">Deskripsi Pengingat</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-3 py-3 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary" id="reminder-desc" placeholder="Contoh: Booster F4 Tahunan" type="text"/>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1" for="reminder-date">Tanggal Pengingat</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-3 py-3 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary" id="reminder-date" type="date"/>
</div>
<button class="w-full border-2 border-primary text-primary bg-surface py-3 rounded-full font-label-md text-label-md hover:bg-primary/5 active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]">add</span>
            Tambah Pengingat
        </button>
</div>
</section>
</main>
<div class="fixed bottom-0 left-0 w-full bg-surface border-t border-outline-variant p-4 z-40 md:bg-transparent md:border-t-0 md:pointer-events-none flex justify-center">
<div class="w-full max-w-3xl md:pointer-events-auto">
<button class="w-full bg-primary text-on-primary py-4 rounded-full font-label-md text-label-md flex justify-center items-center shadow-md hover:bg-on-primary-fixed-variant active:scale-[0.98] transition-all duration-200">
                Simpan Rekam Medis
            </button>
</div>
</div>
</body></html>
