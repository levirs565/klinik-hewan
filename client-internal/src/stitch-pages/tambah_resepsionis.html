<!DOCTYPE html>

                    "surface-container-lowest": "#ffffff",
                    "on-secondary-fixed": "#131b2e",
                    "secondary": "#565e74",
                    "on-surface": "#0b1c30",
                    "inverse-on-surface": "#eaf1ff",
                    "primary-fixed-dim": "#8bd6b6",
                    "secondary-container": "#dae2fd",
                    "secondary-fixed": "#dae2fd",
                    "on-tertiary-fixed": "#131e19",
                    "on-tertiary-container": "#becac2",
                    "on-secondary": "#ffffff",
                    "on-error-container": "#93000a",
                    "surface-container": "#e5eeff",
                    "primary-container": "#065f46",
                    "outline": "#6f7973",

            "borderRadius": {
                    "DEFAULT": "0.125rem",

            },
            "spacing": {
                    "gutter": "16px",
                    "container-margin": "24px",
                    "section-gap": "40px",
                    "base": "8px"
            },
            "fontFamily": {
                    "body-sm": [
                            "Inter"
                    ],
                    "body-lg": [
                            "Inter"
                    ],
                    "label-md": [
                            "Inter"
                    ],
                    "headline-md": [
                            "Hanken Grotesk"
                    ],

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen font-body-md flex flex-col md:hidden">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-on-background w-full sticky top-0 z-10 no-shadow border-b border-outline-variant flex items-center justify-between px-gutter h-16 transition-colors">
<button aria-label="Go back" class="text-on-surface-variant hover:bg-surface-container-low transition-colors cursor-pointer active:scale-95 p-2 rounded-full focus:outline-none">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed absolute left-1/2 -translate-x-1/2">Tambah Resepsionis</h1>
<div class="w-10"></div> <!-- Placeholder for balance -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-gutter pt-container-margin pb-[100px] overflow-y-auto">
<!-- Profile Picture Section -->
<div class="flex flex-col items-center mb-8 relative">
<div class="relative w-24 h-24 rounded-full bg-surface-container-highest flex items-center justify-center border-2 border-dashed border-outline-variant cursor-pointer group hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-outline text-[40px] group-hover:text-primary transition-colors" data-icon="person">person</span>
<button aria-label="Add profile picture" class="absolute bottom-0 right-0 bg-primary text-on-primary rounded-full w-8 h-8 flex items-center justify-center border-2 border-surface shadow-sm active:scale-95 transition-transform">
<span class="material-symbols-outlined text-sm" data-icon="add" data-weight="fill">add</span>
</button>
</div>
<span class="mt-3 font-label-md text-label-md text-on-surface-variant">Foto Profil</span>
</div>
<!-- Form Section -->
<form class="space-y-6">
<!-- Nama Resepsionis -->
<div class="flex flex-col">
<label class="font-label-md text-label-md text-on-surface mb-2" for="nama">Nama Resepsionis <span class="text-primary">*</span></label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-outline" id="nama" placeholder="Full Name" required="" type="text"/>
</div>
</div>
<!-- Tanggal Lahir -->
<div class="flex flex-col">
<label class="font-label-md text-label-md text-on-surface mb-2" for="tgl-lahir">Tanggal Lahir <span class="text-primary">*</span></label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors appearance-none [&amp;::-webkit-calendar-picker-indicator]:opacity-0 [&amp;::-webkit-calendar-picker-indicator]:absolute [&amp;::-webkit-calendar-picker-indicator]:w-full" id="tgl-lahir" required="" type="date"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline pointer-events-none" data-icon="calendar_month">calendar_month</span>
</div>
</div>
<!-- Riwayat Pendidikan -->
<div class="flex flex-col">
<label class="font-label-md text-label-md text-on-surface mb-2" for="pendidikan">Riwayat Pendidikan <span class="text-primary">*</span></label>
<div class="relative">
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-outline resize-none" id="pendidikan" placeholder="Highest education level" required="" rows="3"></textarea>
</div>
</div>
<!-- Tanggal Masuk -->
<div class="flex flex-col">
<label class="font-label-md text-label-md text-on-surface mb-2" for="tgl-masuk">Tanggal Masuk <span class="text-primary">*</span></label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors appearance-none [&amp;::-webkit-calendar-picker-indicator]:opacity-0 [&amp;::-webkit-calendar-picker-indicator]:absolute [&amp;::-webkit-calendar-picker-indicator]:w-full" id="tgl-masuk" required="" type="date"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline pointer-events-none" data-icon="calendar_month">calendar_month</span>
</div>
</div>
<!-- Divider -->
<hr class="border-t border-outline-variant my-6"/>
<!-- Status Section -->
<div class="flex items-center justify-between bg-surface-container-lowest border border-outline-variant rounded-lg p-4">
<div class="flex flex-col">
<span class="font-headline-sm text-headline-sm text-on-surface">Status</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Aktifkan resepsionis ini</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" id="status-toggle" type="checkbox"/>
<div class="w-14 h-8 bg-surface-container-highest peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-7 after:w-7 after:transition-all peer-checked:bg-primary"></div>
<span class="ml-3 font-label-md text-label-md text-primary" id="status-label">Aktif</span>
</label>
</div>
</form>
</main>
<!-- Sticky Footer Button -->
<div class="fixed bottom-0 left-0 w-full p-gutter bg-surface/90 backdrop-blur-md border-t border-outline-variant z-20 pb-safe">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 rounded-xl flex justify-center items-center active:scale-[0.98] transition-transform shadow-sm hover:bg-on-primary-fixed-variant">
            Simpan
        </button>
</div>
<script>
        // Simple toggle logic to update label text based on state
        const toggle = document.getElementById('status-toggle');
        const label = document.getElementById('status-label');

        toggle.addEventListener('change', function() {
            if(this.checked) {
                label.textContent = 'Aktif';
                label.classList.remove('text-on-surface-variant');
                label.classList.add('text-primary');
            } else {
                label.textContent = 'Nonaktif';
                label.classList.remove('text-primary');
                label.classList.add('text-on-surface-variant');
            }
        });
    </script>
</body></html>
