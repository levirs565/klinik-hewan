<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Tambah Dokter - VetConnect</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Hanken+Grotesk:wght@600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

                extend: {

                        "surface-container-low": "#eff4ff",
                        "inverse-surface": "#213145",

                        "error": "#ba1a1a",
                        "tertiary-fixed-dim": "#bdcac1",
                        "on-secondary-container": "#5c647a",
                        "primary-fixed": "#a6f2d1",
                        "outline-variant": "#bec9c2",
                        "tertiary": "#333f39",
                        "surface-container-high": "#dce9ff",
                        "primary": "#004532",
                        "on-primary-fixed-variant": "#00513b",
                        "on-surface-variant": "#3f4944",
                        "secondary-fixed-dim": "#bec6e0",
                        "on-error": "#ffffff",
                        "on-background": "#0b1c30",
                        "surface-container-highest": "#d3e4fe",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed": "#131b2e",
                        "secondary": "#565e74",
                        "on-surface": "#0b1c30",
                        "inverse-on-surface": "#eaf1ff",
                        "primary-fixed-dim": "#8bd6b6",
                        "secondary-container": "#dae2fd",
                        "secondary-fixed": "#dae2fd",
                        "on-tertiary-fixed": "#131e19",
                        "on-tertiary-container": "#becac2",
                        "on-secondary": "#ffffff",
                        "on-error-container": "#93000a",
                        "surface-container": "#e5eeff",
                        "primary-container": "#065f46",
                        "outline": "#6f7973",
                        "surface-bright": "#f8f9ff",
                        "on-tertiary-fixed-variant": "#3e4943",
                        "surface-tint": "#1b6b51",
                        "surface": "#f8f9ff",
                        "surface-dim": "#cbdbf5",
                        "tertiary-fixed": "#d9e6dd",
                        "surface-variant": "#d3e4fe",
                        "on-primary-container": "#8bd6b7",
                        "inverse-primary": "#8bd6b6",
                        "on-primary": "#ffffff",
                        "on-primary-fixed": "#002116",
                        "error-container": "#ffdad6",
                        "background": "#f8f9ff",
                        "tertiary-container": "#4a564f",
                        "on-tertiary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "container-margin": "24px",
                        "section-gap": "40px",
                        "base": "8px"
                    },
                    "fontFamily": {
                        "body-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-md": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "display-lg": ["Hanken Grotesk"],
                        "body-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-sm": ["Hanken Grotesk"]
                    },
                    "fontSize": {

                        "label-md": ["14px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "14px", "fontWeight": "500" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }]

                }
            }
        }

<style>
        /* Hide scrollbar for clean mobile look */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
        /* Custom date picker styling to ensure consistency across browsers */
        input[type="date"]::-webkit-calendar-picker-indicator {
            opacity: 0;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-background min-h-screen flex justify-center text-on-surface antialiased">
<!-- Mobile Screen Container -->
<div class="w-full max-w-md bg-surface min-h-screen relative flex flex-col shadow-2xl">
<!-- Header: Transactional TopAppBar style -->
<header class="sticky top-0 z-50 flex items-center justify-between px-container-margin h-16 w-full bg-surface/90 backdrop-blur-sm border-b border-outline-variant">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-low transition-colors active:scale-95">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'wght' 300;">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-on-surface flex-1 text-center truncate pr-10">Tambah Dokter</h1>
</header>
<!-- Main Form Content -->
<main class="flex-1 overflow-y-auto px-container-margin py-container-margin pb-[100px]">
<!-- Profile Picture Uploader -->
<div class="flex justify-center mb-8 pt-4">
<div class="relative group cursor-pointer">
<div class="w-28 h-28 rounded-full bg-surface-container-highest border-2 border-dashed border-outline-variant flex flex-col items-center justify-center text-outline transition-all duration-200 group-hover:bg-surface-container group-hover:border-primary group-hover:text-primary">
<span class="material-symbols-outlined text-4xl mb-1" style="font-variation-settings: 'wght' 300;">person</span>
<span class="font-label-sm text-label-sm text-on-surface-variant group-hover:text-primary">Upload</span>
</div>
<!-- Badge -->
<div class="absolute bottom-1 right-1 bg-primary text-on-primary w-8 h-8 rounded-full flex items-center justify-center border-[3px] border-surface shadow-sm transition-transform group-hover:scale-110">
<span class="material-symbols-outlined text-lg" style="font-variation-settings: 'wght' 600;">add</span>
</div>
</div>
</div>
<!-- Form Fields -->
<form class="space-y-6">
<!-- Nama Dokter -->
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface flex items-center gap-1" for="nama_dokter">
                        Nama Dokter <span class="text-error">*</span>
</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl px-4 py-3.5 text-body-md font-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" id="nama_dokter" placeholder="Full Name with Title" type="text">
</div>
</div>
<!-- Tanggal Lahir -->
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface" for="tanggal_lahir">Tanggal Lahir</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl px-4 py-3.5 text-body-md font-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all appearance-none pr-12" id="tanggal_lahir" type="date">
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none">calendar_month</span>
</div>
</div>
<!-- Riwayat Pendidikan -->
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface" for="riwayat_pendidikan">Riwayat Pendidikan</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl px-4 py-3.5 text-body-md font-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all resize-none" id="riwayat_pendidikan" placeholder="University, Degree, Year" rows="3"></textarea>
</div>
<div class="grid grid-cols-2 gap-4">
<!-- Tanggal Mulai Praktik -->
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface" for="tanggal_mulai">Mulai Praktik</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl px-3 py-3.5 text-body-md font-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all appearance-none" id="tanggal_mulai" type="date">
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none text-[20px]">calendar_today</span>
</div>
</div>
<!-- Tanggal Masuk -->
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface" for="tanggal_masuk">Tanggal Masuk</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl px-3 py-3.5 text-body-md font-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all appearance-none" id="tanggal_masuk" type="date">
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none text-[20px]">event_available</span>
</div>
</div>
</div>
<!-- Riwayat Tempat Praktek -->
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface" for="riwayat_praktek">Riwayat Tempat Praktek</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl px-4 py-3.5 text-body-md font-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all resize-none" id="riwayat_praktek" placeholder="Previous clinics or hospitals" rows="3"></textarea>
</div>
<!-- Divider -->
<hr class="border-outline-variant/50">
<!-- Status Toggle Section -->
<div class="flex items-center justify-between py-2 rounded-xl bg-surface-container-low px-4">
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface">Status</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Aktifkan Dokter Ini</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value="">
<div class="w-12 h-6 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-outline-variant after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
<span class="ml-3 font-label-md text-label-md text-primary peer-checked:text-primary text-outline">Aktif</span>
</label>
</div>
</form>
</main>
<!-- Fixed Footer Action -->
<footer class="absolute bottom-0 left-0 w-full bg-surface border-t border-outline-variant px-container-margin py-4 pb-6 shadow-[0_-4px_20px_rgba(0,0,0,0.05)] z-40">
<button class="w-full bg-primary text-on-primary py-3.5 rounded-xl font-label-md text-label-md flex justify-center items-center gap-2 hover:bg-on-primary-fixed-variant transition-colors active:scale-[0.98] shadow-sm" type="button">
<span class="material-symbols-outlined text-lg" style="font-variation-settings: 'wght' 600;">save</span>
                Simpan
            </button>
</footer>
</div>


</body></html>
