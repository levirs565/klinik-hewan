<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Isi Detail Medis - VetConnect</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#dae2fd",
                        "on-tertiary-fixed": "#131e19",
                        "surface-variant": "#d3e4fe",
                        "secondary-fixed-dim": "#bec6e0",
                        "on-tertiary-fixed-variant": "#3e4943",
                        "surface": "#f8f9ff",
                        "primary-fixed-dim": "#8bd6b6",
                        "surface-container-lowest": "#ffffff",
                        "outline-variant": "#bec9c2",
                        "surface-container-low": "#eff4ff",
                        "tertiary-fixed": "#d9e6dd",
                        "tertiary-container": "#4a564f",
                        "primary-container": "#065f46",
                        "surface-container-high": "#dce9ff",
                        "surface-container": "#e5eeff",
                        "on-primary": "#ffffff",
                        "on-secondary-fixed-variant": "#3f465c",
                        "on-secondary-fixed": "#131b2e",
                        "surface-bright": "#f8f9ff",
                        "on-error": "#ffffff",
                        "inverse-primary": "#8bd6b6",
                        "on-tertiary-container": "#becac2",
                        "surface-tint": "#1b6b51",
                        "primary": "#004532",
                        "inverse-on-surface": "#eaf1ff",
                        "tertiary-fixed-dim": "#bdcac1",
                        "surface-dim": "#cbdbf5",
                        "surface-container-highest": "#d3e4fe",
                        "on-primary-fixed": "#002116",
                        "inverse-surface": "#213145",
                        "background": "#f8f9ff",
                        "on-secondary": "#ffffff",
                        "secondary-container": "#dae2fd",
                        "on-surface-variant": "#3f4944",
                        "error-container": "#ffdad6",
                        "secondary": "#565e74",
                        "on-error-container": "#93000a",
                        "on-primary-container": "#8bd6b7",
                        "on-tertiary": "#ffffff",
                        "outline": "#6f7973",
                        "primary-fixed": "#a6f2d1",
                        "tertiary": "#333f39",
                        "on-background": "#0b1c30",
                        "on-secondary-container": "#5c647a",
                        "on-primary-fixed-variant": "#00513b",
                        "error": "#ba1a1a",
                        "on-surface": "#0b1c30"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "base": "8px",
                        "section-gap": "40px",
                        "gutter": "16px",
                        "container-margin": "24px"
                    },
                    "fontFamily": {
                        "body-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-sm": ["Hanken Grotesk"],
                        "label-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-md": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "body-lg": ["Inter"],
                        "display-lg": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "14px", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen pb-[100px] font-body-md antialiased selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Header -->
<header class="sticky top-0 z-40 bg-surface border-b border-outline-variant flex items-center justify-between px-container-margin h-16 w-full">
<button aria-label="Go back" class="flex items-center justify-center p-2 rounded-full hover:bg-surface-container-low transition-colors text-primary">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary truncate max-w-[200px] md:max-w-none">Isi Detail Medis</h1>
<button class="font-label-md text-label-md text-primary hover:text-on-primary-fixed-variant transition-colors px-2 py-2 rounded-md hover:bg-surface-container-low">
            Save
        </button>
</header>
<main class="max-w-4xl mx-auto p-gutter md:p-container-margin md:py-8 space-y-8">
<!-- Section 1: Pemeriksaan Fisik -->
<section class="bg-surface-container-lowest rounded-xl border border-outline-variant p-6">
<h2 class="font-headline-sm text-headline-sm text-primary mb-6 flex items-center gap-2">
<span class="material-symbols-outlined text-primary">stethoscope</span>
                Pemeriksaan Fisik
            </h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Weight & Temp -->
<div class="space-y-4">
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="weight">Weight (kg) <span class="text-primary">*</span></label>
<input class="w-full rounded-lg border-outline-variant bg-surface-container-lowest text-on-surface focus:border-primary focus:ring-1 focus:ring-primary shadow-sm font-body-md text-body-md" id="weight" placeholder="e.g. 12.5" step="0.1" type="number"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="temp">Temperature (°C) <span class="text-primary">*</span></label>
<input class="w-full rounded-lg border-outline-variant bg-surface-container-lowest text-on-surface focus:border-primary focus:ring-1 focus:ring-primary shadow-sm font-body-md text-body-md" id="temp" placeholder="e.g. 38.5" step="0.1" type="number"/>
</div>
</div>
<!-- Condition & Vitals -->
<div class="space-y-4">
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="condition">General Physical Condition <span class="text-primary">*</span></label>
<select class="w-full rounded-lg border-outline-variant bg-surface-container-lowest text-on-surface focus:border-primary focus:ring-1 focus:ring-primary shadow-sm font-body-md text-body-md" id="condition">
<option value="">Select condition...</option>
<option value="good">Good / Normal</option>
<option value="fair">Fair / Mild symptoms</option>
<option value="poor">Poor / Severe symptoms</option>
<option value="critical">Critical</option>
</select>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="vitals">Heart Rate &amp; Respiratory Rate</label>
<input class="w-full rounded-lg border-outline-variant bg-surface-container-lowest text-on-surface focus:border-primary focus:ring-1 focus:ring-primary shadow-sm font-body-md text-body-md" id="vitals" placeholder="HR: __ bpm, RR: __ bpm" type="text"/>
</div>
</div>
</div>
</section>
<!-- Section 2: Treatment Details -->
<section class="bg-surface-container-lowest rounded-xl border border-outline-variant p-6">
<h2 class="font-headline-sm text-headline-sm text-primary mb-6 flex items-center gap-2">
<span class="material-symbols-outlined text-primary">medical_services</span>
                Treatment Details
            </h2>
<div class="space-y-6">
<!-- Symptoms -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="symptoms">Clinical Symptoms <span class="text-primary">*</span></label>
<textarea class="w-full rounded-lg border-outline-variant bg-surface-container-lowest text-on-surface focus:border-primary focus:ring-1 focus:ring-primary shadow-sm font-body-md text-body-md resize-none" id="symptoms" placeholder="Describe observed symptoms..." rows="3"></textarea>
</div>
<!-- Diagnosis (Prominent) -->
<div class="p-4 bg-surface-container-low rounded-lg border border-primary-fixed-dim border-l-4 border-l-primary">
<label class="block font-headline-sm text-headline-sm text-primary mb-2" for="diagnosis">Diagnosis <span class="text-error">*</span></label>
<textarea class="w-full rounded-md border-outline-variant bg-surface-container-lowest text-on-surface focus:border-primary focus:ring-1 focus:ring-primary shadow-sm font-body-md text-body-md resize-none" id="diagnosis" placeholder="Primary and secondary diagnoses..." rows="4"></textarea>
</div>
<!-- Procedures -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="procedures">Medical Procedures Performed</label>
<textarea class="w-full rounded-lg border-outline-variant bg-surface-container-lowest text-on-surface focus:border-primary focus:ring-1 focus:ring-primary shadow-sm font-body-md text-body-md resize-none" id="procedures" placeholder="List tests, surgeries, or other procedures..." rows="3"></textarea>
</div>
<!-- Prescription Section -->
<div class="border-t border-outline-variant pt-6 mt-6">
<div class="flex justify-between items-center mb-4">
<h3 class="font-label-md text-label-md text-on-surface font-semibold flex items-center gap-2">
<span class="material-symbols-outlined text-secondary">medication</span>
                            Prescription
                        </h3>
</div>
<div class="space-y-4" id="prescription-list">
<!-- Initial Medication Row -->
<div class="flex flex-col md:flex-row gap-4 p-4 bg-[#F8FAFC] rounded-lg border border-outline-variant/50">
<div class="flex-1">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1">Drug Name</label>
<input class="w-full rounded-md border-outline-variant bg-surface-container-lowest text-on-surface focus:border-primary focus:ring-1 focus:ring-primary shadow-sm font-body-sm text-body-sm" placeholder="e.g. Amoxicillin" type="text"/>
</div>
<div class="w-full md:w-32">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1">Dosage</label>
<input class="w-full rounded-md border-outline-variant bg-surface-container-lowest text-on-surface focus:border-primary focus:ring-1 focus:ring-primary shadow-sm font-body-sm text-body-sm" placeholder="e.g. 50mg" type="text"/>
</div>
<div class="w-full md:w-48">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1">Frequency</label>
<input class="w-full rounded-md border-outline-variant bg-surface-container-lowest text-on-surface focus:border-primary focus:ring-1 focus:ring-primary shadow-sm font-body-sm text-body-sm" placeholder="e.g. 2x daily" type="text"/>
</div>
<div class="flex items-end justify-end">
<button class="p-2 text-error hover:bg-error-container rounded-md transition-colors" title="Remove medication" type="button">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
</div>
</div>
<button class="mt-4 flex items-center gap-2 font-label-md text-label-md text-primary hover:text-on-primary-fixed-variant transition-colors py-2 px-3 rounded-md hover:bg-surface-container-low border border-dashed border-primary/50 w-full justify-center" onclick="addMedicationRow()" type="button">
<span class="material-symbols-outlined text-sm">add</span>
                        Add Medication
                    </button>
</div>
<!-- Home Care Instructions -->
<div class="mt-6">
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="homecare">Home Care Instructions</label>
<textarea class="w-full rounded-lg border-outline-variant bg-[#FEF9C3] text-on-surface focus:border-primary focus:ring-1 focus:ring-primary shadow-sm font-body-md text-body-md resize-none" id="homecare" placeholder="Special diet, activity restrictions, etc..." rows="3"></textarea>
</div>
<!-- Total Cost -->
<div class="border-t border-outline-variant pt-6 mt-6">
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="cost">Estimated Total Medical Cost (Rp)</label>
<div class="relative rounded-md shadow-sm">
<div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
<span class="text-on-surface-variant sm:text-sm">Rp</span>
</div>
<input class="block w-full rounded-lg border-outline-variant pl-10 bg-surface-container-lowest text-on-surface focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md" id="cost" name="cost" placeholder="0" type="number"/>
</div>
</div>
</div>
</section>
</main>
<!-- Footer Action -->
<section class="bg-surface-container-lowest rounded-xl border border-outline-variant p-6 mt-8 mb-8 mx-gutter md:mx-0">
<h2 class="font-headline-sm text-headline-sm text-primary mb-6 flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-[20px]">notifications</span>
        Atur Pengingat
    </h2>
<!-- Saved Reminder Card -->
<div class="bg-surface-container p-4 rounded-xl mb-6">
<div class="flex justify-between items-start mb-2">
<span class="px-2 py-0.5 bg-primary-container text-on-primary-container text-label-sm rounded-full">Vaksin</span>
<button class="text-error hover:bg-error-container p-1 rounded-md">
<span class="material-symbols-outlined text-sm">delete</span>
</button>
</div>
<h4 class="font-body-md font-semibold text-on-surface mb-2">Booster F4 Tahunan</h4>
<div class="flex items-center gap-2 text-on-surface-variant text-body-sm">
<span class="material-symbols-outlined text-sm">calendar_today</span>
            13 May 2027
        </div>
</div>
<div class="border-t border-outline-variant/30 mb-6"></div>
<div class="space-y-4">
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1">Pilih Layanan Pengingat</label>
<select class="w-full rounded-lg border-outline-variant bg-surface-container-lowest text-on-surface focus:border-primary focus:ring-1 focus:ring-primary shadow-sm font-body-md text-body-md">
<option selected="" value="pengobatan">Pengobatan</option>
<option value="vaksin">Vaksin</option>
<option value="checkup">Check-up</option>
</select>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1">Deskripsi Pengingat</label>
<input class="w-full rounded-lg border-outline-variant bg-surface-container-lowest text-on-surface focus:border-primary focus:ring-1 focus:ring-primary shadow-sm font-body-md text-body-md" placeholder="e.g. Minum Obat Cacing" type="text"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1">Tanggal Pengingat</label>
<input class="w-full rounded-lg border-outline-variant bg-surface-container-lowest text-on-surface focus:border-primary focus:ring-1 focus:ring-primary shadow-sm font-body-md text-body-md" type="date"/>
</div>
<button class="w-full py-2.5 px-4 border border-primary text-primary font-label-md rounded-lg hover:bg-primary/5 transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]">add</span>
            Tambah Pengingat
        </button>
</div>
</section><div class="fixed bottom-0 left-0 right-0 p-4 bg-surface border-t border-outline-variant shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-50 flex justify-end">
<div class="w-full max-w-4xl mx-auto flex justify-end">
<button class="w-full md:w-auto bg-primary text-on-primary font-label-md text-label-md py-3 px-8 rounded-full hover:bg-on-primary-fixed-variant transition-colors shadow-sm flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]">save</span>
                Simpan Rekam Medis
            </button>
</div>
</div>
<script>
        function addMedicationRow() {
            const list = document.getElementById('prescription-list');
            const row = document.createElement('div');
            row.className = 'flex flex-col md:flex-row gap-4 p-4 bg-[#F8FAFC] rounded-lg border border-outline-variant/50 mt-4';
            row.innerHTML = `
                <div class="flex-1">
                    <label class="block font-label-sm text-label-sm text-on-surface-variant mb-1">Drug Name</label>
                    <input type="text" class="w-full rounded-md border-outline-variant bg-surface-container-lowest text-on-surface focus:border-primary focus:ring-1 focus:ring-primary shadow-sm font-body-sm text-body-sm" placeholder="e.g. Amoxicillin">
                </div>
                <div class="w-full md:w-32">
                    <label class="block font-label-sm text-label-sm text-on-surface-variant mb-1">Dosage</label>
                    <input type="text" class="w-full rounded-md border-outline-variant bg-surface-container-lowest text-on-surface focus:border-primary focus:ring-1 focus:ring-primary shadow-sm font-body-sm text-body-sm" placeholder="e.g. 50mg">
                </div>
                <div class="w-full md:w-48">
                    <label class="block font-label-sm text-label-sm text-on-surface-variant mb-1">Frequency</label>
                    <input type="text" class="w-full rounded-md border-outline-variant bg-surface-container-lowest text-on-surface focus:border-primary focus:ring-1 focus:ring-primary shadow-sm font-body-sm text-body-sm" placeholder="e.g. 2x daily">
                </div>
                <div class="flex items-end justify-end">
                    <button type="button" onclick="this.closest('.flex-col').remove()" class="p-2 text-error hover:bg-error-container rounded-md transition-colors" title="Remove medication">
                        <span class="material-symbols-outlined">delete</span>
                    </button>
                </div>
            `;
            list.appendChild(row);
        }
    </script>
</body></html>
